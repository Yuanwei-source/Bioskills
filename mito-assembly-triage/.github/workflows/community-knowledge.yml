name: community-knowledge-check

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'schemas/**'
      - 'tools/experience.py'
      - 'tests/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject secrets and raw data
        shell: bash
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(fastq|fq|bam|sam)(\.gz)?$'; then
            echo 'raw sequencing files are not allowed in knowledge contributions'; exit 1
          fi
          if grep -RIE '(api[_-]?key|password|secret|BEGIN (RSA|OPENSSH) PRIVATE KEY)' knowledge; then
            echo 'possible secret detected'; exit 1
          fi
      - name: Python syntax and tests
        run: |
          python3 -m py_compile tools/experience.py
          python3 -m unittest -v tests/test_security.py
