name: community-knowledge-check

on:
  pull_request:
    paths:
      - 'mito-assembly-triage/knowledge/**'
      - 'mito-assembly-triage/schemas/**'
      # scripts/ and references/ were missing: a change to annot_check.py or
      # cox1_id.py alone used to skip this workflow entirely.
      - 'mito-assembly-triage/scripts/**'
      - 'mito-assembly-triage/tools/**'   # 含 audit_code_docs.py 与文档契约基线
      - 'mito-assembly-triage/tools/experience.py'
      - 'mito-assembly-triage/tests/**'
      - 'mito-assembly-triage/SKILL.md'
      - 'mito-assembly-triage/references/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/workflows/community-knowledge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        # jsonschema makes test_both_paths_agree actually execute instead of
        # skipping; the no-jsonschema fallback stays covered by the tests that
        # call _case_errors_without_jsonschema directly.  The sequence tools let
        # the guard-wrapped integration tests (real blastn XML2, minimap2) run
        # rather than skip, so a green run means these paths were exercised.
        run: |
          python -m pip install --disable-pip-version-check biopython jsonschema
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ncbi-blast+ minimap2 samtools
      - name: Diff quality gate
        shell: bash
        working-directory: mito-assembly-triage
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Reject secrets and raw data
        shell: bash
        working-directory: mito-assembly-triage
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -E '\.(fastq|fq|bam|sam)(\.gz)?$'; then
            echo 'raw sequencing files are not allowed in knowledge contributions'; exit 1
          fi
          if grep -RIE '(api[_-]?key|password|secret|BEGIN (RSA|OPENSSH) PRIVATE KEY)' knowledge; then
            echo 'possible secret detected'; exit 1
          fi
      - name: Python syntax and tests
        working-directory: mito-assembly-triage
        run: |
          python3 -m py_compile tools/experience.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
